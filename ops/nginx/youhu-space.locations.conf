# Include this file inside the existing HTTPS `server` block for youhu.space.
# TLS certificates and the HTTP-to-HTTPS redirect stay in the host-level config.

root /srv/youhu-website/current;
index index.html;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# Deploy and verify this upstream before switching DNS. The Vercel function in
# api/apply.js remains the fallback when the site itself is hosted on Vercel.
location = /api/apply {
  client_max_body_size 128k;
  limit_except POST { deny all; }

  proxy_http_version 1.1;
  proxy_pass http://127.0.0.1:8000/api/apply;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

location = /index.html {
  return 308 /;
}

location ~ ^/(manifesto|product|founders|apply|privacy|terms)\.html$ {
  return 308 /$1$is_args$args;
}

location ~* \.(?:woff2|png|svg)$ {
  try_files $uri =404;
  expires 30d;
}

location ~* \.(?:css|js)$ {
  try_files $uri =404;
  expires 5m;
}

location / {
  try_files $uri $uri.html =404;
}
